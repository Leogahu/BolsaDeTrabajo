# ─── URLs dinámicas (sobreescribir en Render con variables de entorno) ────────
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# ─── Springdoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs-json
springdoc.swagger-ui.path=/api-docs
